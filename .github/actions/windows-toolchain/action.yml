# The pinned LLVM and glslc for the Windows jobs (docs/building.md, Windows releases).

name: windows-toolchain
description: Pinned LLVM and glslc on PATH

runs:
  using: composite
  steps:
    - name: LLVM
      shell: pwsh
      env:
        # Chocolatey checks the installer against the package's checksum
        LLVM_VERSION: 23.1.3
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        choco upgrade llvm --version $env:LLVM_VERSION --allow-downgrade --no-progress -y
        'C:\Program Files\LLVM\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
    # glslc from the shaderc commit of tools/dist/Dockerfile, so both releases embed the same SPIR-V
    - id: shaderc
      name: shaderc version
      shell: pwsh
      run: |
        $docker = Get-Content tools/dist/Dockerfile -Raw
        "tag=$([regex]::Match($docker, 'ARG SHADERC_TAG=(\S+)').Groups[1].Value)" >> $env:GITHUB_OUTPUT
        "commit=$([regex]::Match($docker, 'ARG SHADERC_COMMIT=(\S+)').Groups[1].Value)" >> $env:GITHUB_OUTPUT
    - id: glslc-cache
      uses: actions/cache/restore@v4
      with:
        path: C:\glslc
        key: glslc-windows-x64-${{ steps.shaderc.outputs.commit }}
    - name: glslc
      if: steps.glslc-cache.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        SHADERC_TAG: ${{ steps.shaderc.outputs.tag }}
        SHADERC_COMMIT: ${{ steps.shaderc.outputs.commit }}
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
        Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
        $src = Join-Path $env:RUNNER_TEMP 'shaderc'
        git -c advice.detachedHead=false clone --depth 1 --branch $env:SHADERC_TAG https://github.com/google/shaderc $src
        if ((git -C $src rev-parse HEAD) -ne $env:SHADERC_COMMIT)
        {
            throw "shaderc $env:SHADERC_TAG is not commit $env:SHADERC_COMMIT"
        }
        python (Join-Path $src 'utils\git-sync-deps')
        cmake -S $src -B "$src\build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DSHADERC_SKIP_TESTS=ON -DSHADERC_SKIP_EXAMPLES=ON -DSHADERC_SKIP_COPYRIGHT_CHECK=ON `
            -DSPIRV_SKIP_EXECUTABLES=ON -DENABLE_GLSLANG_BINARIES=OFF
        ninja -C "$src\build" glslc_exe
        New-Item -ItemType Directory -Force C:\glslc | Out-Null
        Copy-Item "$src\build\glslc\glslc.exe" C:\glslc\
    # Saved here, as a post step saves only when the whole job passes
    - if: steps.glslc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: C:\glslc
        key: glslc-windows-x64-${{ steps.shaderc.outputs.commit }}
    - shell: pwsh
      run: |
        'C:\glslc' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
