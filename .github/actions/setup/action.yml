# LFS files and the image of tools/samples/Dockerfile for the Linux CI jobs (docs/testing.md, CI).
# The image comes from the actions cache, as it takes minutes to build from the Arch Linux Archive.

name: setup
description: LFS files and the pinned test image, cached

runs:
  using: composite
  steps:
    - uses: ./.github/actions/lfs
    - id: image
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/puppetxr-samples.tar.zst
        key: samples-image-${{ hashFiles('tools/samples/Dockerfile') }}
    - name: Build the image
      if: steps.image.outputs.cache-hit != 'true'
      shell: bash
      run: |
        docker build --platform linux/amd64 -t puppetxr-samples tools/samples
        docker save puppetxr-samples | zstd -T0 -o "$RUNNER_TEMP/puppetxr-samples.tar.zst"
    - if: steps.image.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/puppetxr-samples.tar.zst
        key: samples-image-${{ hashFiles('tools/samples/Dockerfile') }}
    - name: Load the image
      if: steps.image.outputs.cache-hit == 'true'
      shell: bash
      run: zstd -dc "$RUNNER_TEMP/puppetxr-samples.tar.zst" | docker load
