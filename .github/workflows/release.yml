# Builds the releases of tools/dist/ and drafts a GitHub release from them (docs/building.md,
# Releasing).
# A pushed tag vX.Y.Z builds the Linux, Windows and source releases and uploads them with
# SHA256SUMS to a draft release named after the tag, its notes taken from
# CHANGELOG.md. Run by hand, it builds the same from any branch without releasing (a dry run), or
# with "pin" writes tools/dist/windows-toolchain.json from the runner's toolchain to commit.
# Artifacts only carry files to the release job and count against the account's storage quota,
# so they expire after three days.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      pin:
        description: 'Only pin the Windows toolchain (uploads windows-toolchain.json)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: ${{ !inputs.pin }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Version and release notes
        shell: bash
        run: |
          version=$(sed -n 's/^project(puppetxr VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]
          then
              if [[ "$GITHUB_REF_NAME" != "v$version" ]]
              then
                  echo "::error::tag $GITHUB_REF_NAME does not match the CMake project version $version"
                  exit 1
              fi
              heading="## $version "
          else
              heading="## Unreleased"
          fi
          awk -v h="$heading" 'index($0, h) == 1 { f = 1; next } f && /^## / { exit } f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md
          then
              echo "::error::no entries under '$heading' in CHANGELOG.md"
              exit 1
          fi
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md
          retention-days: 3

  linux:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: tools/dist/dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/dist-linux/out/*
          if-no-files-found: error
          retention-days: 3

  source:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: tools/dist/dist-src.sh
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: build/dist-src/out/*
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'success' || inputs.pin) }}
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/windows-toolchain
      - name: Pin
        if: ${{ inputs.pin }}
        run: ./tools/dist/dist.ps1 -Pin
      - if: ${{ inputs.pin }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-toolchain
          path: tools/dist/windows-toolchain.json
          retention-days: 3
      - name: Build
        if: ${{ !inputs.pin }}
        run: ./tools/dist/dist.ps1
      - if: ${{ !inputs.pin }}
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/dist-windows/out/*
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [check, linux, source, windows]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir dist
          mv artifacts/linux/* artifacts/source/* artifacts/windows/* dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # A re-run replaces the files of the existing draft
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1
          then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file artifacts/notes/notes.md
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
              gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                  --title "puppetxr $VERSION" --notes-file artifacts/notes/notes.md dist/*
          fi
